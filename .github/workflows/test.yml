name: test

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 * *'  # monthly, to catch distribution updates breaking the thumbnailer

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: false
      - run: uv run test_thumbnailer.py

  gnome:
    name: gnome (ubuntu ${{ matrix.ubuntu }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04', '26.04']
    container:
      image: ubuntu:${{ matrix.ubuntu }}
      options: --privileged  # GNOME runs thumbnailers in a bubblewrap sandbox
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies from the README, plus GNOME's thumbnail factory
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-numpy python3-pil make \
            shared-mime-info python3-gi gir1.2-gnomedesktop-4.0 bubblewrap
      - run: make install
      - run: python3 test_gnome.py
